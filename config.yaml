# Exercise Form Detection System Configuration

# Pose Detection Settings
pose_detection:
  model_complexity: 1  # 0, 1, or 2 (higher = more accurate but slower)
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  enable_segmentation: false
  
# Temporal Smoothing
smoothing:
  enabled: true
  window_size: 5  # Number of frames to average

# Performance
performance:
  target_fps: 30
  max_fps: 60

# Squat Thresholds
squat:
  # Depth thresholds (hip to ankle ratio)
  depth_shallow_threshold: 0.60  # Above this is shallow
  depth_parallel_threshold: 0.55  # Parallel squat
  depth_deep_threshold: 0.50     # Deep squat
  
  # how we'l; decide knee alignment detection
  # ─────────────────────────────────────────────────────────────────────
  # KNEE VALGUS (knees caving inward / knock knees)
  #   Current: 0.5 (lenient - catches severe knock knees only)
  #   Stricter: 0.75-0.85 (catches minor inward collapse)
  #   Perfect form: 0.9+ (knees must stay directly over ankles, this is quite hard, not practical as I saw)
  knee_valgus_threshold: 0.5
  
  # KNEE SPREAD (knees too wide / rhombus legs)
  #   Current: 2.4 (lenient - extreme splay of knees only)
  #   Stricter: 1.6-1.8 (catches moderate spread)
  #   Perfect form: 1.4-1.5 (knees must track over toes precisely, again too hard but recommended by ai)
  knee_spread_threshold: 2.4
  # ─────────────────────────────────────────────────────────────────────
  
  # FOOT ANGLE (feet pointing inward/outward)
  # ─────────────────────────────────────────────────────────────────────
  # We measure the angle each foot makes relative to "forward" (straight ahead).
  # Positive = outward (duck feet), Negative = inward (pigeon toed).
  # Natural stance: feet can be 0-30° outward comfortably.
  # 
  # foot_outward_threshold: max degrees outward before warning
  #   Current: 50 (lenient - only catches very duck-footed stance)
  #   Stricter: 35-40 (catches moderate external rotation)
  #   Note: 90° would be perpendicular/sideways
  foot_outward_threshold: 60
  
  # foot_inward_threshold: max degrees inward before warning
  #   Current: 20 (catches pigeon-toed stance)
  #   Stricter: 10-15 (catches minor internal rotation)
  #   Note: Inward feet are generally worse for knee health
  foot_inward_threshold: 20
  # ─────────────────────────────────────────────────────────────────────
  
  # Forward lean (torso angle from vertical)
  forward_lean_threshold: 45  # degrees
  
  # Phase detection
  standing_hip_angle: 160  # Hip angle when standing
  bottom_hip_angle: 110    # Hip angle at bottom position (higher = easier, lower = deeper squat required)

# Push-up Thresholds
pushup:
  # Hip sag detection (hip drop from straight line)
  hip_sag_threshold: 15  # degrees from straight
  
  # Range of motion (elbow angle)
  top_elbow_angle: 160    # Arms extended
  bottom_elbow_angle: 90  # Bottom position
  shallow_threshold: 110  # Incomplete ROM
  
  # Elbow flare (angle from body)
  elbow_flare_threshold: 45  # degrees

# Lunge Thresholds
lunge:
  # Front knee alignment (over ankle)
  knee_over_toe_threshold: 0.1  # Ratio of knee-to-toe distance
  
  # Depth (back knee to ground)
  depth_threshold: 0.3  # Ratio to leg length
  
  # Balance (torso lean)
  torso_lean_threshold: 20  # degrees from vertical
  
  # Phase detection
  standing_front_knee_angle: 170
  lunge_front_knee_angle: 90

# Visualization
visualization:
  show_skeleton: true
  show_landmarks: true
  landmark_radius: 5
  line_thickness: 2
  feedback_font_scale: 0.7
  feedback_font_thickness: 2

# Logging
logging:
  enabled: true
  output_directory: "logs"
  session_prefix: "exercise_session"
  
# Calibration
calibration:
  enabled: true
  required_frames: 60  # Frames to collect for calibration
  standing_pose_required: true
