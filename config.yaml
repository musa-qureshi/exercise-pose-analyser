# Exercise Form Detection System Configuration

# Pose Detection Settings
pose_detection:
  model_complexity: 1  # 0, 1, or 2 (higher = more accurate but slower)
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  enable_segmentation: false
  
# Temporal Smoothing
smoothing:
  enabled: true
  window_size: 5  # Number of frames to average

# Performance
performance:
  target_fps: 30
  max_fps: 60

# Squat Thresholds
squat:
  # Depth thresholds (hip to ankle vertical distance in normalized coordinates)
  # Higher value = more lenient, catches more shallow squats
  # When squatting: hips move down toward ankles, reducing vertical distance
  depth_shallow_threshold: 0.55  # Above this is shallow - increased to detect shallow squats better
  depth_parallel_threshold: 0.45  # Parallel squat (good depth)
  depth_deep_threshold: 0.40     # Deep squat (excellent depth)
  
  # how we'll decide knee alignment detection
  # ─────────────────────────────────────────────────────────────────────
  # KNEE VALGUS (knees caving inward / knock knees)
  #   Current: 0.5 (lenient - catches severe knock knees only)
  #   Stricter: 0.75-0.85 (catches minor inward collapse)
  #   Perfect form: 0.9+ (knees must stay directly over ankles, this is quite hard, not practical as I saw)
  knee_valgus_threshold: 0.5
  
  # KNEE SPREAD (knees too wide / rhombus legs)
  #   Current: 2.4 (lenient - extreme splay of knees only)
  #   Stricter: 1.6-1.8 (catches moderate spread)
  #   Perfect form: 1.4-1.5 (knees must track over toes precisely, again too hard but recommended by ai)
  knee_spread_threshold: 2.4
  # ─────────────────────────────────────────────────────────────────────
  
  # FOOT ANGLE (feet pointing inward/outward)
  # ─────────────────────────────────────────────────────────────────────
  # We measure the angle each foot makes relative to "forward" (straight ahead).
  # Positive = outward (duck feet), Negative = inward (pigeon toed).
  # Natural stance: feet can be 0-30° outward comfortably.
  # 
  # foot_outward_threshold: max degrees outward before warning
  #   Current: 50 (lenient - only catches very duck-footed stance)
  #   Stricter: 35-40 (catches moderate external rotation)
  #   Note: 90° would be perpendicular/sideways
  foot_outward_threshold: 60
  
  # foot_inward_threshold: max degrees inward before warning
  #   Current: 20 (catches pigeon-toed stance)
  #   Stricter: 10-15 (catches minor internal rotation)
  #   Note: Inward feet are generally worse for knee health
  foot_inward_threshold: 20
  # ─────────────────────────────────────────────────────────────────────
  
  # Forward lean (torso angle from vertical)
  forward_lean_threshold: 45  # degrees
  
  # Phase detection
  standing_hip_angle: 160  # Hip angle when standing
  bottom_hip_angle: 110    # Hip angle at bottom position (higher = easier, lower = deeper squat required)

# Push-up Thresholds
pushup:
  # Hip sag detection (hip drop from straight line)
  hip_sag_threshold: 15  # degrees from straight
  
  # Range of motion (elbow angle)
  top_elbow_angle: 160    # Arms extended
  bottom_elbow_angle: 90  # Bottom position
  shallow_threshold: 110  # Incomplete ROM
  
  # Elbow flare (angle from body)
  elbow_flare_threshold: 45  # degrees

# Lunge Thresholds
# -----------------------------------------------------------------------------
# CAMERA POSITIONING: Stand SIDEWAYS to camera (your left or right side facing it)
# This allows the system to see your front and back leg positions clearly.
# The system will NOT detect lunges if you're facing the camera directly.
# -----------------------------------------------------------------------------
lunge:
  # Sideways detection - shoulder/hip width threshold
  # When sideways, shoulders appear narrow. This prevents squats being detected as lunges.
  # Lower = stricter (must be more sideways), Higher = more lenient
  sideways_threshold: 0.12
  
  # Minimum horizontal (X) foot separation for lunge stance
  # Feet must be this far apart front-to-back to count as a lunge
  # Also: X separation must be GREATER than Y separation (prevents squat detection)
  min_foot_separation: 0.10

  # ============================================================================
  # FORM CHECKS (warnings only - don't prevent rep counting)
  # ============================================================================
  
  # Front knee alignment (how far knee extends FORWARD past ankle)
  # ----------------------------------------------------------------------------
  # Measures horizontal distance knee goes PAST the ankle (directional, not absolute)
  # EASIER: 0.12-0.15 (allows knee to travel forward more)
  # MODERATE: 0.08-0.10 (some forward travel allowed)
  # HARDER: 0.05-0.07 (knee must stay almost directly over ankle)
  knee_over_toe_threshold: 0.08
  
  # Back knee depth (vertical height of back knee above ground)
  # ----------------------------------------------------------------------------
  # Measures how high the back knee is above ground level (front ankle position)
  # In normalized coords, this is the Y difference from knee to ground
  # Error shows when knee height above ground > threshold
  # LOWER VALUE = STRICTER (error persists longer, knee must drop closer to ground)
  # HIGHER VALUE = MORE LENIENT (error clears sooner)
  # STRICT: 0.08-0.12 (knee must drop very close to ground)
  # MODERATE: 0.15-0.20 (knee must drop noticeably) 
  # LENIENT: 0.25-0.30 (knee doesn't have to go very low)
  depth_threshold: 0.15
  
  # Back leg extension (horizontal distance from back knee to front heel)
  # ----------------------------------------------------------------------------
  # Ensures back leg isn't too straight. Back knee should drop down 
  # relatively close to (but behind) the front foot.
  # EASIER: 0.35+ (allows very extended back leg)
  # MODERATE: 0.28-0.32 (back knee reasonably close)
  # HARDER: 0.18-0.22 (back knee must be close to front heel)
  back_knee_max_distance: 0.30
  
  # Torso lean (angle from vertical - catches BOTH forward and backward lean)
  # ----------------------------------------------------------------------------
  # Only triggers for SIGNIFICANT lean - some lean is natural during lunges
  # EASIER: 45-50 degrees (only warns for extreme lean)
  # MODERATE: 35-40 degrees (warns for noticeable lean)
  # HARDER: 25-30 degrees (strict upright posture required)
  torso_lean_threshold: 15
  
  # ============================================================================
  # PHASE DETECTION (controls when a rep counts)
  # ============================================================================
  
  # standing_front_knee_angle: Angle above which you're considered "UP"
  # ----------------------------------------------------------------------------
  # EASIER: 130-140 degrees (don't need to straighten leg much)
  # HARDER: 150-160 degrees (must fully straighten front leg)
  standing_front_knee_angle: 140
  
  # lunge_front_knee_angle: Angle below which you're considered "DOWN"
  # ----------------------------------------------------------------------------
  # EASIER: 130-140 degrees (shallow lunge counts)
  # MODERATE: 110-120 degrees (decent depth required)
  # HARDER: 90-100 degrees (must reach proper 90 degree lunge)
  lunge_front_knee_angle: 115

# Visualization
visualization:
  show_skeleton: true
  show_landmarks: true
  landmark_radius: 5
  line_thickness: 2
  feedback_font_scale: 0.7
  feedback_font_thickness: 2

# Logging
logging:
  enabled: true
  output_directory: "logs"
  session_prefix: "exercise_session"
  
# Calibration
calibration:
  enabled: true
  required_frames: 60  # Frames to collect for calibration
  standing_pose_required: true
