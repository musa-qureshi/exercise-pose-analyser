# Exercise Form Detection System Configuration

pose_detection:
  model_complexity: 1  # 0, 1, or 2 (higher = more accurate but slower)
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  enable_segmentation: false
  
# Temporal Smoothing
smoothing:
  enabled: true
  window_size: 5  # Number of frames to average

# Performance
performance:
  target_fps: 30
  max_fps: 60

squat:
  # Depth thresholds (hip to ankle vertical distance in normalized coordinates)
  # Higher value = more lenient, catches more shallow squats
  depth_shallow_threshold: 0.55  # Above this is shallow - increased to detect shallow squats better
  depth_parallel_threshold: 0.45  # Parallel squat (good depth)
  depth_deep_threshold: 0.40     # Deep squat (excellent depth)
  
  # how we'll decide knee alignment detection
  # KNEE VALGUS (knees caving inward / knock knees)
  #   Current: 0.5 (lenient - catches severe knock knees only)
  #   Stricter: 0.75-0.85 (catches minor inward collapse)
  #   Perfect form: 0.9+ (knees must stay directly over ankles, this is quite hard, not practical)
  knee_valgus_threshold: 0.5
  
  # KNEE SPREAD (knees too wide / rhombus legs)
  #   Current: 2.4 (lenient - extreme splay of knees only)
  #   Stricter: 1.6-1.8 (catches moderate spread)
  #   Perfect form: 1.4-1.5 (knees must track over toes precisely, again too hard but recommended by ai)
  knee_spread_threshold: 2.4
  
  # foot_outward_threshold: max degrees outward before warning
  #   Current: 60 (lenient - only catches very duck-footed stance)
  #   Stricter: 35-40 (catches moderate external rotation)
  foot_outward_threshold: 60
  
  # foot_inward_threshold: max degrees inward before warning
  #   Current: 20 (catches pigeon-toed stance)
  #   Stricter: 10-15 (catches minor internal rotation)
  foot_inward_threshold: 20
  
  forward_lean_threshold: 10  # degrees
  
  # Phase detection
  standing_hip_angle: 160 
  bottom_hip_angle: 110    #(higher = easier, lower = deeper squat required)

pushup:
  hip_sag_threshold: 20 
  
  # Range of motion (elbow angle)
  top_elbow_angle: 160    # Arms extended
  bottom_elbow_angle: 90  # Bottom position
  shallow_threshold: 100  # Incomplete ROM

# Lunge Thresholds
# CAMERA POSITIONING: Stand SIDEWAYS to camera (your left or right side facing it)
# The system will NOT detect lunges if you're facing the camera directly.
lunge:
  # Lower = stricter (must be more sideways), Higher = more lenient
  sideways_threshold: 0.12
  
  # Minimum horizontal (X) foot separation for lunge stance
  # Feet must be this far apart front-to-back to count as a lunge
  # Also: X separation must be GREATER than Y separation (prevents squat detection)
  min_foot_separation: 0.10
  
  # Front knee alignment (horizontal distance knee goes past ankle)
  # EASIER: 0.20+ (allows knee to travel forward)
  # MODERATE: 0.15 (current)
  # HARDER: 0.08-0.10 (knee must stay directly over ankle)
  knee_over_toe_threshold: 0.15
  
  # Back knee depth (vertical distance from back knee to ground/ankle)
  # EASIER: 0.40-0.50 (knee can stay high)
  # MODERATE: 0.25-0.35 (knee must drop noticeably)
  # HARDER: 0.15-0.20 (knee must nearly touch ground)
  depth_threshold: 0.25
  
  # Back leg extension (horizontal distance from back knee to front heel)
  # EASIER: 0.35+ (allows very extended back leg)
  # MODERATE: 0.28-0.32 (back knee reasonably close)
  # HARDER: 0.18-0.22 (back knee must be close to front heel)
  back_knee_max_distance: 0.30
  
  # Torso lean (angle from vertical - catches BOTH forward and backward lean)
  # EASIER: 40-50 degrees (allows significant lean)
  # MODERATE: 25-35 degrees (some lean allowed)
  # HARDER: 15-20 degrees (torso must stay very upright)
  torso_lean_threshold: 20
  
  # PHASE DETECTION (controls when a rep counts)
  # standing_front_knee_angle: Angle above which you're considered "UP"
  # EASIER: 130-140 degrees (don't need to straighten leg much)
  # HARDER: 150-160 degrees (must fully straighten front leg)
  standing_front_knee_angle: 140
  
  # lunge_front_knee_angle: Angle below which you're considered "DOWN"
  # EASIER: 130-140 degrees (shallow lunge counts)
  # MODERATE: 110-120 degrees (decent depth required)
  # HARDER: 90-100 degrees (must reach proper 90 degree lunge)
  lunge_front_knee_angle: 115

visualization:
  show_skeleton: true
  show_landmarks: true
  landmark_radius: 5
  line_thickness: 2
  feedback_font_scale: 0.7
  feedback_font_thickness: 2

logging:
  enabled: true
  output_directory: "logs"
  session_prefix: "exercise_session"
  
calibration:
  enabled: true
  required_frames: 60
  standing_pose_required: true
